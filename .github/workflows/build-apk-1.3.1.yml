name: Build e testes do J.A.R.V.I.S. Nova

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'JARVIS-NOVA-1.2.7-fonte.zip'
      - '.github/workflows/build-apk-1.3.1.yml'

permissions:
  contents: read

concurrency:
  group: jarvis-nova-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testar e compilar APK debug
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java para o Android
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair código-fonte enviado ao repositório
        run: |
          if [ -f JARVIS-NOVA-1.2.7-fonte.zip ]; then
            mkdir -p /tmp/jarvis-source
            unzip -q JARVIS-NOVA-1.2.7-fonte.zip -d /tmp/jarvis-source
            SRC=/tmp/jarvis-source/JARVIS-NOVA
            test -f "$SRC/package.json"
            # O ponto e vírgula é escapado para o shell: \\;
            find "$SRC" -mindepth 1 -maxdepth 1 ! -name .github -exec cp -a {} . \;
          fi
          test -f package.json || { echo 'Envie JARVIS-NOVA-1.2.7-fonte.zip para a raiz do repositório antes de executar o build.'; exit 1; }

      - name: Instalar dependências Node
        run: npm install --ignore-scripts --legacy-peer-deps

      - name: Compatibilidade com teste legado do workflow
        run: cp .github/workflows/build-apk-1.3.1.yml .github/workflows/build-apk.yml

      - name: Testes estáticos e regressão
        run: npm run test:all

      - name: Preparar os recursos web do aplicativo
        run: |
          mkdir -p www
          cp index.html style.css app.js apps.js www/

      - name: Gerar estrutura nativa do Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Aplicar identidade, permissões, versão e detector local
        id: native-patches
        run: |
          D=android/app/src/main/java/com/jarvis/nova
          mkdir -p "$D"
          cp MainActivity.java JarvisBackgroundPlugin.java JarvisService.java JarvisUtilPlugin.java JarvisLocalAIPlugin.java JarvisAlarmReceiver.java JarvisAlarmScheduler.java JarvisBootReceiver.java JarvisNotificationListener.java "$D/"
          python3 patch_manifest.py android/app/src/main/AndroidManifest.xml
          if [ -f ensure_jitpack_repository.py ]; then python3 ensure_jitpack_repository.py android; else echo "Script opcional ensure_jitpack_repository.py ausente; seguindo com a configuração Gradle do projeto."; fi
          python3 patch_gradle.py android/app/build.gradle || echo "Aviso: patch_gradle retornou erro de repositório; a configuração será corrigida diretamente."
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/settings.gradle")
          s = p.read_text(encoding="utf-8")
          s = s.replace("RepositoriesMode.PREFER_SETTINGS", "RepositoriesMode.PREFER_PROJECT").replace("RepositoriesMode.FAIL_ON_PROJECT_REPOS", "RepositoriesMode.PREFER_PROJECT")
          p.write_text(s, encoding="utf-8")
          if "https://jitpack.io" not in s:
              if re.search(r"repositories\s*\{", s):
                  s = re.sub(r"(repositories\s*\{)", r"\1\n        maven { url = uri('https://jitpack.io') }", s, count=1)
              elif "dependencyResolutionManagement" in s:
                  s = re.sub(r"(dependencyResolutionManagement\s*\{)", r"\1\n    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)\n    repositories { google(); mavenCentral(); maven { url = uri('https://jitpack.io') } }", s, count=1)
              else:
                  s += "\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories { google(); mavenCentral(); maven { url = uri('https://jitpack.io') } }\n}\n"
              p.write_text(s, encoding="utf-8")
          print("Repositório JitPack configurado em settings.gradle")
          PY
          if [ -f ensure_jitpack_app_repository.py ]; then
            python3 ensure_jitpack_app_repository.py android/app/build.gradle || echo "Aviso: script auxiliar JitPack não aplicável; repositório já tratado em settings.gradle."
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/settings.gradle")
          s = p.read_text(encoding="utf-8")
          s = s.replace("RepositoriesMode.PREFER_SETTINGS", "RepositoriesMode.PREFER_PROJECT")
          s = s.replace("RepositoriesMode.FAIL_ON_PROJECT_REPOS", "RepositoriesMode.PREFER_PROJECT")
          p.write_text(s, encoding="utf-8")
          print("Política Gradle final: PREFER_PROJECT")
          PY
          python3 patch_android_version.py android/app/build.gradle VERSAO.json
          python3 patch_visual.py android

      - name: Compilar APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          if ! ./gradlew assembleDebug --no-daemon; then
            echo "Primeira compilação falhou; tentando novamente sem as personalizações de splash/ícone."
            python3 ../patch_visual.py . desfazer
            ./gradlew assembleDebug --no-daemon
          fi
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt

      - name: Publicar APK e checksum
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Nova-1.3.1-APK
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/apk-sha256.txt
          retention-days: 14
